services:
  - type: web
    name: rststore
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/v1/config/paypal
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
