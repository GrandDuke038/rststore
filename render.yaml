services:
  - type: web
    name: rststore
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/v1/config/paypal
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_URI
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: https://rststore.onrender.com/api/v1/tiktok/callback
      - key: TIKTOK_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: TIKTOK_OAUTH_STATE_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
